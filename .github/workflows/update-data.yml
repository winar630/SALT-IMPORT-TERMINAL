name: 관세청 소금 수입자료 매일 갱신

on:
  schedule:
    - cron: "7 23 * * *"   # 매일 08:07 KST
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 관세청 API 수집
        env:
          KCS_SERVICE_KEY: ${{ secrets.KCS_SERVICE_KEY }}
        run: python scripts/fetch_kcs.py

      - name: 바뀐 자료 저장(commit)
        run: |
          git config user.name "salt-bot"
          git config user.email "salt-bot@users.noreply.github.com"
          git add site/data/salt_import_data.csv
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 관세청 자료 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
