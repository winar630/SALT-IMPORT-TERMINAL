name: 관세청 소금 수입자료 매일 갱신

on:
  schedule:
    - cron: "7 23 * * *"   # 매일 08:07 KST
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 관세청 API 수집
        env:
          KCS_SERVICE_KEY: ${{ secrets.KCS_SERVICE_KEY }}
        run: python scripts/fetch_kcs.py

      - name: 관세환율 수집 (실패해도 계속)
        continue-on-error: true
        env:
          KCS_SERVICE_KEY: ${{ secrets.KCS_SERVICE_KEY }}
        run: python scripts/fetch_fx.py

      - name: 바뀐 자료 저장(commit)
        run: |
          git config user.name "salt-bot"
          git config user.email "salt-bot@users.noreply.github.com"
          git add site/data/salt_import_data.csv
          git add site/data/fx_usd.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 관세청 자료 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: 업로드 반영 대기
        run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: 실패 시 1분 뒤 재시도 대기
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
