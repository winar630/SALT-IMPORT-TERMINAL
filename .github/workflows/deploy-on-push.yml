name: 화면 수정 시 사이트 다시 올리기

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: 업로드 반영 대기
        run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: 실패 시 1분 뒤 재시도 대기
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
